name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:preview
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:menu
      - name: Configure isolated local test environment
        run: node -e "require('fs').writeFileSync('.dev.vars','AUTH_SECRET='+require('crypto').randomBytes(32).toString('hex')+'\nREQUIRE_ADMIN_MFA=true\n')"
      - run: npm run db:migrate:local
      - name: Run separate-browser customer, cashier and display journey
        run: |
          npm run dev -- --ip 127.0.0.1 --port 8787 --var DEMO_HOURLY_LIMIT:100 > /tmp/zimara-menu-test.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:e2e -- http://127.0.0.1:8787
          npm run test:onboarding -- http://127.0.0.1:8787
          npm run test:launch -- http://127.0.0.1:8787 output/playwright/launch
          npm run test:subscriber-menu
          npm run test:magic-color
          npm run test:identity-ownership -- http://127.0.0.1:8787
          npm run test:workbench -- http://127.0.0.1:8787 output/playwright/workbench
          npm run test:agency -- http://127.0.0.1:8787 output/playwright/agency
          npm run test:workspace -- http://127.0.0.1:8787 output/playwright/workspace
          npm run test:resilience -- http://127.0.0.1:8787 output/playwright/resilience
          npm run test:brand-workspace -- http://127.0.0.1:8787 output/playwright/brand-workspace
          npm run test:tenant-studio -- http://127.0.0.1:8787 output/playwright/tenant-studio
          npm run test:design -- http://127.0.0.1:8787 output/playwright/design
          npm run test:magic -- http://127.0.0.1:8787 output/playwright/magic
          npm run test:ordering -- http://127.0.0.1:8787 output/playwright/ordering
          npm run test:menu-first-load -- http://127.0.0.1:8787 output/playwright/menu-first-load
          npm run test:customer-menu -- http://127.0.0.1:8787 output/playwright/next-menu
          npm run test:menu-merchandising -- http://127.0.0.1:8787 output/playwright/menu-owner-phase1
          npm run test:preview-privacy -- output/playwright/preview-privacy
          npm run test:studio-proposals -- http://127.0.0.1:8787 output/playwright/studio-proposals
          npm run test:studio-entry -- http://127.0.0.1:8787 output/playwright/studio-entry
          npm run test:studio-inline -- http://127.0.0.1:8787 output/playwright/studio-inline
          npm run test:studio-canvas -- http://127.0.0.1:8787 output/playwright/studio-canvas
          npm run test:design-gallery -- http://127.0.0.1:8787 output/playwright/design-gallery
          npm run test:customer-worlds -- http://127.0.0.1:8787 output/playwright/customer-worlds
          npm run test:waitlist -- http://127.0.0.1:8787 output/playwright/waitlist
          npm run test:loyalty -- http://127.0.0.1:8787 output/playwright/loyalty
          npm run test:security -- http://localhost:8787 output/playwright/security
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connected-browser-evidence
          path: output/playwright/
